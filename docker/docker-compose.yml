services:
  api:
    build: .
    image: defectvision-api:latest
    container_name: defectvision-api
    ports:
      - "8000:8000"
    environment:
      MODEL_SOURCE: local
      MAX_UPLOAD_BYTES: "10485760"
    volumes:
      - ./models:/app/models:ro
      - ./uploads:/app/uploads
    restart: unless-stopped