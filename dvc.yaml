stages:
  data_ingestion:
    cmd: python -m src.data.data_ingestion
    deps:
      - src/data/data_ingestion.py
      - src/constants.py
      - data/raw/metal_nut.tar.xz
    params:
      - data_ingestion
    outs:
      - data/raw/metal_nut
      - data/processed/records.csv

  data_splitting:
    cmd: python -m src.data.data_splitting
    deps:
      - src/data/data_splitting.py
      - src/constants.py
      - data/processed/records.csv
    params:
      - data_splitting
    outs:
      - data/processed/splits.csv

  feature_extraction:
    cmd: python -m src.features.feature_extraction
    deps:
      - src/features/feature_extraction.py
      - src/features/feature_extractor.py
      - data/processed/splits.csv
    params:
      - preprocessing
      - feature_extraction
      - data_splitting.seed
    outs:
      - data/interim/fit_embeddings.pt
  memory_bank:
    cmd: python -m src.model.memory_bank
    deps:
      - src/model/memory_bank.py
      - src/model/coreset.py
      - data/interim/fit_embeddings.pt
    params:
      - memory_bank
    outs:
      - models/memory_bank.pt
  threshold_calibration:
    cmd: python -m src.model.threshold_calibration
    deps:
      - src/model/threshold_calibration.py
      - src/model/patchcore.py
      - src/model/coreset.py
      - src/features/feature_extractor.py
      - src/data/dataset.py
      - models/memory_bank.pt
      - data/processed/splits.csv
    params:
      - preprocessing
      - feature_extraction
      - scoring
      - threshold
      - data_splitting.seed
    outs:
      - models/threshold.json
  model_evaluation:
    cmd: python -m src.evaluation.model_evaluation
    deps:
      - src/evaluation/model_evaluation.py
      - src/evaluation/metrics.py
      - src/evaluation/benchmark.py
      - src/visualization/visualize.py
      - src/model/patchcore.py
      - src/model/coreset.py
      - src/features/feature_extractor.py
      - src/data/dataset.py
      - models/memory_bank.pt
      - models/threshold.json
      - data/processed/splits.csv
    params:
      - preprocessing
      - feature_extraction
      - scoring
      - evaluation
      - data_splitting.seed
    outs:
      - reports/metrics/metrics_by_subset.csv
      - reports/metrics/test_scores.csv
    metrics:
      - reports/metrics/metrics.json:
          cache: false